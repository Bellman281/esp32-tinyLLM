# Measured on-device results — the single source for BENCHMARKING.md's per-stage
# table and for png/benchmark-stages.svg. `scripts/plot_stages.py` reads this
# file and emits both, so a figure cannot be updated in one place and left
# stale in the other. That has already happened once in this repo's history:
# see BENCHMARKING.md's "Why matched settings matter".
#
# Runs appear in the table and chart in FILE ORDER, which is chronological --
# so a migrated historical run goes in its place in the sequence, not at the end.
#
# ADD a [run.<id>] section per measurement. Do NOT edit an existing run to
# "update" it — add a new one carrying its own commit and date, so the record of
# what was measured, when, and against which tree survives. Mark a run
# `provisional = 1` while its numbers are still being pinned down; the plotter
# renders those with a hatched fill and the table footnotes them.
#
# Stage figures are the firmware's own `profile ms/token:` line. `wall_ms` is
# the wall-clock per-token cost from the `--- N tokens in T s ---` line, which
# runs ~2–3 ms/token above the profiled sum on both engines (token sampling,
# argmax and serial output are outside the profiled stages). Quote tok/s from
# `wall_ms`, never from the stage sum.
#
# `#` STARTS A COMMENT ANYWHERE ON A LINE, including inside a quoted value --
# the reader strips it before parsing. So a value cannot contain `#`: write
# "PR 22", not "#22". The failure is a confusing int() error, not a clear one.
#
# FORMAT: the same restricted TOML subset model/models.toml uses — `key = value`
# inside a [section], values being quoted strings or numbers, `#` starting a
# comment. Kept inside that subset so a shell or Python reader needs no TOML
# library.

[settings]
board       = "ESP32-S3-DevKitC N16R8, chip rev v0.2, dual LX7 @ 240 MHz, 8 MB PSRAM (OPI), 16 MB flash (QIO)"
model       = "tinystories-v32768"
model_sha256 = "3e5870b42d54e9f3a58b7b7d2a483b6f85170b5732bc1af6ac21a488a7fa7bbe"
n_generate  = 400
prompt_len  = 18
note        = "attn is the only stage that scales with sequence position, so runs at different n_generate/prompt_len are NOT comparable. benchmark_settings_match.rs gates both firmwares to these values."
parity = "Every Rust run from [run.rust-digest] onward is checked, not asserted: the firmware folds every emitted token id into llm_core::TokenDigest and prints it, and model/models.toml pins the value that llm-host/tests/token_stream_digest.rs recomputes through llm_forward_with_head_override with the head reproduced exactly as head.rs computes it. Earlier rows say byte-identical on the strength of someone reading the story; this one says it on the strength of 0x327578cb136fd6aa."
reproducibility = "A given binary reproduces exactly on this board: two independent hard-reset runs of each of the two Rust binaries below returned the same wall clock to 0.01 s and the same per-stage figures to 0.1 ms, matching what the C firmware already did across three runs. So a single run per binary is enough, and there is no run-to-run noise floor to hide behind -- a per-stage difference between two binaries is real even in a stage neither of them touched. See BENCHMARKING.md, 'Reproducibility and the layout tax'."

