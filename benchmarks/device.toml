date    = "2026-08-19"
commit  = "perf/nibble-lut (58ec1ed)"
note    = "head rose 94.6 -> 98.0 despite this commit not touching head.rs. Reproducible, not noise: both binaries were re-run from a hard reset and returned identical figures. Read as a code/data layout effect -- the commit adds two lookup tables and reshapes four loops in llm-core, and head streams 2.43 MB through a 64 KB cache every token, so instruction and rodata placement move it. The same thing cost 4.3 ms across c7f2ce7 (90.3 -> 94.6), which also does not touch head.rs. Net is still -5.7 ms: -9.1 across the four stages this commit does touch, +3.4 of layout tax on one it does not."
