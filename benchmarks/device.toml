experimental_note = "Requires CONFIG_IDF_EXPERIMENTAL_FEATURES; Espressif documents 120 MHz as temperature-sensitive and not recommended across the industrial range, and this board's boya flash part refused it and fell back. Real, reproducible, bit-exact -- and not what you get by cloning this repo. It was a +3.3% opt-in AT THE TIME; the engine has moved twice since, and [run.rust-fast-mspi-dot2] is the current measurement of the same flag."
note    = "Config only, no code change, bit-exact -- token digest still 0x327578cb136fd6aa OK. PSRAM 80->120 MHz, which forces flash along with it because they share the MSPI peripheral and ESP-IDF has no 80M-flash timing table at the 240 MHz core clock that 120M PSRAM implies. Bandwidth: 1 core 72->81 MB/s, 2 cores 91->131, core scaling 1.27x->1.62x. NOT separately attributable by construction; a follow-up (exp/flash-80m) raised flash 40->80 with PSRAM left at 80 and measured 106.6 ms, i.e. NOTHING, which rules out the flash module clock as the cause and points at the shared MSPI core clock instead. EXPERIMENTAL: needs CONFIG_IDF_EXPERIMENTAL_FEATURES, is temperature-sensitive per Espressif, and this board's boya flash part logged 'High performance mode of this flash model hasn.t been supported' -- it refused 120 MHz flash and fell back. Do not copy into a product."
