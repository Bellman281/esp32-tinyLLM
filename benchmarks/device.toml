# Measured on-device results — the single source for BENCHMARKING.md's per-stage
# table and for png/benchmark-stages.svg. `scripts/plot_stages.py` reads this
# file and emits both, so a figure cannot be updated in one place and left
# stale in the other. That has already happened once in this repo's history:
# see BENCHMARKING.md's "Why matched settings matter".
#
# Runs appear in the table and chart in FILE ORDER, which is chronological --
# so a migrated historical run goes in its place in the sequence, not at the end.
#
# ADD a [run.<id>] section per measurement. Do NOT edit an existing run to
# "update" it — add a new one carrying its own commit and date, so the record of
# what was measured, when, and against which tree survives. Mark a run
# `provisional = 1` while its numbers are still being pinned down; the plotter
# renders those with a hatched fill and the table footnotes them.
#
# Stage figures are the firmware's own `profile ms/token:` line. `wall_ms` is
# the wall-clock per-token cost from the `--- N tokens in T s ---` line, which
# runs ~2–3 ms/token above the profiled sum on both engines (token sampling,
# argmax and serial output are outside the profiled stages). Quote tok/s from
# `wall_ms`, never from the stage sum.
#
# FORMAT: the same restricted TOML subset model/models.toml uses — `key = value`
# inside a [section], values being quoted strings or numbers, `#` starting a
# comment. Kept inside that subset so a shell or Python reader needs no TOML
# library.

[settings]
board       = "ESP32-S3-DevKitC N16R8, chip rev v0.2, dual LX7 @ 240 MHz, 8 MB PSRAM (OPI), 16 MB flash (QIO)"
model       = "tinystories-v32768"
model_sha256 = "3e5870b42d54e9f3a58b7b7d2a483b6f85170b5732bc1af6ac21a488a7fa7bbe"
n_generate  = 400
prompt_len  = 18
note        = "attn is the only stage that scales with sequence position, so runs at different n_generate/prompt_len are NOT comparable. benchmark_settings_match.rs gates both firmwares to these values."
parity = "Every Rust run from [run.rust-digest] onward is checked, not asserted: the firmware folds every emitted token id into llm_core::TokenDigest and prints it, and model/models.toml pins the value that llm-host/tests/token_stream_digest.rs recomputes through llm_forward_with_head_override with the head reproduced exactly as head.rs computes it. Earlier rows say byte-identical on the strength of someone reading the story; this one says it on the strength of 0x327578cb136fd6aa."
reproducibility = "A given binary reproduces exactly on this board: two independent hard-reset runs of each of the two Rust binaries below returned the same wall clock to 0.01 s and the same per-stage figures to 0.1 ms, matching what the C firmware already did across three runs. So a single run per binary is enough, and there is no run-to-run noise floor to hide behind -- a per-stage difference between two binaries is real even in a stage neither of them touched. See BENCHMARKING.md, 'Reproducibility and the layout tax'."

[run.c]
label   = "C reference"
engine  = "c"
date    = "2026-08-05"
commit  = "reference-c/firmware/esp32_llm, arduino-esp32 3.3.10, -O3"
input   = 4.4
attn    = 42.9
ffn     = 6.9
ple     = 8.5
head    = 57.1
wall_ms = 122.0
tok_s   = 8.20

[run.rust-first]
label   = "Rust, first run"
engine  = "rust"
date    = "2026-08-12"
commit  = "pre-dates this file; migrated from BENCHMARKING.md's hand-written optimization history"
note    = "MIGRATED, not re-measured. This row and the two below were recorded in a hand-written table in BENCHMARKING.md before benchmarks/device.toml existed, and were the only copy of them anywhere. Their per-stage figures are as published; wall_ms is DERIVED as 1000/tok_s rather than read off a wall clock, because the original table recorded the profiled sum and tok/s but not the wall figure -- so it carries only the three significant figures tok_s had, and the stages/wall spread for these three rows is not independent evidence of anything. Settings match every other row (400 tokens / 18-token prompt)."
input   = 10.6
attn    = 66.7
ffn     = 15.8
ple     = 20.4
head    = 193.8
wall_ms = 311.5
tok_s   = 3.21

[run.rust-dualcore-head]
label   = "+ dual-core head, unroll"
engine  = "rust"
date    = "2026-08-14"
commit  = "pre-dates this file; migrated from BENCHMARKING.md"
note    = "MIGRATED, not re-measured; wall_ms derived as 1000/tok_s. See [run.rust-first]."
input   = 8.0
attn    = 58.9
ffn     = 11.8
ple     = 15.1
head    = 110.9
wall_ms = 208.8
tok_s   = 4.79

[run.rust-caches]
label   = "+ wider caches"
engine  = "rust"
date    = "2026-08-15"
commit  = "pre-dates this file; migrated from BENCHMARKING.md"
note    = "MIGRATED, not re-measured; wall_ms derived as 1000/tok_s. See [run.rust-first]. This is the run BENCHMARKING.md read as evidence the head was bandwidth-bound (-21% on the head, more than any change had moved any stage). That reading was wrong -- see [run.rust-lanes] -- and the head figure here, 87.6, is also lower than the 94.6 measured for [run.rust-before] one commit later, which is the layout tax rather than a regression."
input   = 7.4
attn    = 53.7
ffn     = 11.2
ple     = 14.3
head    = 87.6
wall_ms = 177.3
tok_s   = 5.64

[run.rust-before]
label   = "Rust, before"
engine  = "rust"
date    = "2026-08-19"
commit  = "feat/ple-v2-header (c7f2ce7)"
input   = 7.8
attn    = 54.4
ffn     = 11.9
ple     = 15.2
head    = 94.6
wall_ms = 187.2
tok_s   = 5.34

[run.rust-after]
label   = "Rust, nibble LUT"
engine  = "rust"
date    = "2026-08-19"
commit  = "perf/nibble-lut (58ec1ed)"
note    = "head rose 94.6 -> 98.0 despite this commit not touching head.rs. Reproducible, not noise: both binaries were re-run from a hard reset and returned identical figures. Read as a code/data layout effect -- the commit adds two lookup tables and reshapes four loops in llm-core, and head streams 2.43 MB through a 64 KB cache every token, so instruction and rodata placement move it. The same thing cost 4.3 ms across c7f2ce7 (90.3 -> 94.6), which also does not touch head.rs. Net is still -5.7 ms: -9.1 across the four stages this commit does touch, +3.4 of layout tax on one it does not."
input   = 6.6
attn    = 50.8
ffn     = 10.1
ple     = 12.7
head    = 98.0
wall_ms = 181.6
tok_s   = 5.51

[run.rust-kv]
label   = "Rust, + KV layout"
engine  = "rust"
date    = "2026-08-19"
commit  = "exp/kv-layout"
note    = "attn -3.8 ms is the change: input/ffn/ple are unchanged to 0.0 ms, which is the signature of a patch that only touches attention.rs. head fell 3.2 ms with head.rs untouched -- the layout tax again, this time in our favour, handing back roughly what perf/nibble-lut cost it. Attribute -3.8 to the mechanism and -3.2 to placement luck that any future commit can take back."
input   = 6.6
attn    = 47.0
ffn     = 10.1
ple     = 12.7
head    = 94.8
wall_ms = 174.6
tok_s   = 5.73

[run.rust-int4]
label   = "+ int4 head"
engine  = "rust"
date    = "2026-08-19"
commit  = "perf(head): stage the output head as int4"
note    = "Staged the head as packed int4 rather than unpacked int8: 2.54 MB -> 1.32 MB streamed, 1.2 MB of PSRAM returned, and the head stage moved 0.0 ms. Kept for the PSRAM. The null result is what prompted instrumenting the stage, which found the reason -- see [run.rust-lanes]."
input   = 6.6
attn    = 47.0
ffn     = 10.1
ple     = 12.7
head    = 94.8
wall_ms = 174.6
tok_s   = 5.73

[run.rust-lanes]
label   = "+ 4 accumulators"
engine  = "rust"
date    = "2026-08-20"
commit  = "perf(head): four accumulators in the int4 dot"
note    = "First change made with the head instrumented. The probe reported 72 MB/s against 13.4 MB/s used, and wait-worker 0.0 with both halves equal, which together say the head is compute-bound rather than bandwidth-bound -- the opposite of what this file previously assumed. Splitting the single accumulator four ways broke the dependency chain: 91.0 -> 81.3. (Baseline 91.0, not 94.8: adding the instrumentation itself moved the head 3.8 ms on code placement.)"
input   = 6.6
attn    = 47.0
ffn     = 10.1
ple     = 12.7
head    = 81.3
wall_ms = 161.0
tok_s   = 6.21

[run.rust-bias]
label   = "+ bias hoist"
engine  = "rust"
date    = "2026-08-20"
commit  = "perf(head): hoist the int4 bias out of the dot; drop the lookup table"
note    = "Two operations removed per element: the -8 bias, hoisted to one per-row correction via sum((c-8)a) == sum(ca) - 8*sum(a), and the NIBBLE_I8 load that had been standing in for it. The table is right for the fp32 paths, where it replaces an int-to-float conversion; on the integer path it replaced a subtract with a memory load, which is a worse trade. head 81.3 -> 61.5, i.e. 1.077x of C. Neither operation was visible at five-stage resolution."
input   = 6.6
attn    = 47.0
ffn     = 10.1
ple     = 12.7
head    = 61.5
wall_ms = 140.9
tok_s   = 7.09

[run.rust-dualcore]
label   = "+ dual-core matvec"
engine  = "rust"
date    = "2026-08-20"
commit  = "perf: run every matvec on both cores, not just the head"
note    = "The head had been the only stage using both LX7 cores; input/attn/ffn/ple ran on one with the worker parked. Splitting each matvec by rows is bit-exact -- y[r] depends only on row r and x -- and llm_forward_with_matvec_override, shipped since Phase 3 with no user, was already the right hook. Sync cost measured at 0.5 ms/token across 43 matvecs, ~11.6 us per round trip, against ~18.6 ms saved. head moved +0.1 ms, so the control held."
input   = 3.9
attn    = 40.2
ffn     = 6.2
ple     = 7.5
head    = 61.6
wall_ms = 122.65
tok_s   = 8.15

[run.rust-final]
label   = "+ argmax/stdout"
engine  = "rust"
date    = "2026-08-20"
commit  = "perf(firmware): the last mile is outside the profiled stages"
note    = "Argmax over a slice instead of a runtime-bounded index, and stdout locked once for the run instead of per token. Both outside the profiled stages, which is why neither had ever been looked at. Splitting that remainder showed emit 0.03 and other 0.00 -- it is all argmax, 2.74 ms, because s.logits lives in PSRAM and 25,353 floats read back with a data-dependent branch runs at about half the bus rate."
input   = 3.8
attn    = 39.8
ffn     = 6.0
ple     = 7.3
head    = 61.5
wall_ms = 121.1
tok_s   = 8.25

[run.rust-argmax]
label   = "+ argmax in head"
engine  = "rust"
date    = "2026-08-20"
commit  = "perf(head): take the argmax where the logits are made"
note    = "The greedy pick no longer reads the logits back. Both cores track the maximum over their own rows while computing them, so the decode loop chooses between two candidates instead of scanning 25,353 floats out of PSRAM. Tie-breaking is identical -- strict > within a half keeps the lowest index, and hi > lo between halves resolves a tie to the lower one, which is what a 0..n scan does. Output byte-identical, which is the only available gate: this path is firmware-only and no host test reaches it. argmax 2.74 -> 0.00 ms/token, and wall clock now equals the profiled sum."
input   = 3.9
attn    = 40.0
ffn     = 6.1
ple     = 7.5
head    = 61.5
wall_ms = 119.0
tok_s   = 8.40

[run.rust-attn-instr]
label   = "+ attn instrumented"
engine  = "rust"
date    = "2026-08-20"
commit  = "instrument attn: split it four ways (56895f7)"
note    = "Instrumentation only -- no arithmetic changed. Recorded because it is the baseline the head split is measured against, and because it is 0.5 ms faster than the run before it in stages nothing touched (attn 40.0 -> 39.0, head 61.5 -> 61.9): the layout tax again, in both directions at once. Skipping it would have credited that 0.5 ms to the next change. The breakdown it bought -- core 28.3, 24% of a token, single-core -- is what identified the last stage running on one LX7."
input   = 3.9
attn    = 39.0
ffn     = 6.2
ple     = 7.6
head    = 61.9
wall_ms = 118.5
tok_s   = 8.43
attn_qkv  = 7.8
attn_rope = 0.14
attn_core = 28.3
attn_proj = 2.7
attn_dual = "qkv proj"

[run.rust-attn-split]
label   = "+ attn heads split"
engine  = "rust"
date    = "2026-08-20"
commit  = "perf(attn): split attention heads across both cores (2dc3662)"
note    = "core 28.3 -> 15.6 and wall 118.5 -> 106.8. Two heads per core, one round trip per layer, sync measured at 0.1 ms/token across 6 calls. A perfect halving would be 14.15 + 0.1 sync = 14.25, so 1.35 ms (9.5%) did not come back. Two candidates and this run cannot separate them: (a) bus contention -- unlike the head, both cores now stream the same KV cache at once, so attention may be partly bandwidth-bound where the head was not; (b) the layout tax -- this binary'"'"'s boot-time PSRAM probe reads 68 MB/s against the previous binary'"'"'s 72 on an identical buffer with identical code, i.e. the memory path measures 5.6% slower before generation starts, and head moved +0.8 ms with head.rs untouched. The distinguishing experiment is to run the bandwidth probe on both cores simultaneously and compare against one; not done."
input   = 3.9
attn    = 26.4
ffn     = 6.2
ple     = 7.6
head    = 62.7
wall_ms = 106.8
tok_s   = 9.36
attn_qkv  = 7.9
attn_rope = 0.15
attn_core = 15.6
attn_proj = 2.7
attn_dual = "qkv proj core"

[run.rust-digest]
label   = "Rust, now"
engine  = "rust"
date    = "2026-08-20"
commit  = "test: make byte-identical output something the board asserts (eb39e59)"
note    = "First run whose parity is verified rather than asserted: token digest 0x327578cb136fd6aa (418 tokens) OK, matching models.toml gen_digest. No arithmetic changed -- the -0.5 ms against [run.rust-attn-split] is the layout tax, this time in our favour, from adding the digest accumulator and its print. Recorded because this is the binary a release is cut from, and because crediting 0.5 ms to a change that computes nothing new is exactly the error the layout-tax section exists to prevent."
input   = 3.9
attn    = 26.3
ffn     = 6.2
ple     = 7.6
head    = 62.3
wall_ms = 106.3
tok_s   = 9.41
attn_qkv  = 7.8
attn_rope = 0.15
attn_core = 15.6
attn_proj = 2.7
attn_dual = "qkv proj core"
