experimental_note = "The opt-in 120 MHz MSPI clock, re-measured on the current engine -- the earlier [run.rust-fast-mspi] row was taken before i16 activations and two rows per pass, and had gone stale enough to read as a downgrade. 91.8 ms/token, 10.89 tok/s: 3.7% faster than the shipping default's 95.2 and 32.9% faster than the C reference (ref/new - 1, the convention every other row here uses -- as elapsed time it is 24.8% less, which is a different number and not the one this file quotes). The two effects compose, which is what you would expect of a memory-side change against two instruction-side ones -- the bus went 68 -> 75 MB/s on the probe and the head, which is compute-bound, moved only 49.7 -> 48.2 while attn (the stage that actually streams) took 27.1 -> 25.6. Still not the default: it needs CONFIG_IDF_EXPERIMENTAL_FEATURES, Espressif documents 120 MHz as temperature-sensitive outside the commercial range, and this board's boya flash part logs 'High performance mode of this flash model hasn't been supported' and stays at its own clock while PSRAM alone goes to 120. Bit-exact: digest 0x327578cb136fd6aa OK."
