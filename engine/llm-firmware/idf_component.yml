# UNVERIFIED STUB -- written without ESP-IDF or network access to confirm
# against the real IDF Component Registry manifest schema or esp-idf-sys's
# current component-manager integration. See src/simd_dot.rs's module doc
# comment point 3, and src/matvec_simd.rs's module doc comment point 4 for
# the analogous fp32 case.
#
# Intent: pull in Espressif's esp-dsp C library (dotprod / PIE-accelerated
# kernels) as a native component, the way `idf.py` projects normally do,
# so `head-simd`'s FFI calls in src/simd_dot.rs (int8) and `matvec-simd`'s
# in src/matvec_simd.rs (fp32) have something to link against. embuild
# (this project's build-dependency) is supposed to invoke ESP-IDF's
# component manager during `cargo build` and pick this file up
# automatically -- confirm that's still true for your pinned embuild/
# esp-idf-sys/IDF versions before assuming this "just works".
#
# Only needed when building with `--features head-simd` and/or
# `--features matvec-simd`. Building with neither (the default) doesn't
# touch this file or esp-dsp at all.
dependencies:
  espressif/esp-dsp: "*"
