[workspace]
resolver = "2"
members = [
    "llm-core",
    "llm-host",
    # "llm-firmware" is deliberately NOT listed here, even though it's
    # written now (Phase 3) -- it targets xtensa-esp32s3-espidf and needs
    # `build-std`/a custom linker/the ESP-IDF C SDK, none of which mix well
    # with this workspace's plain host build. It opts out via its own
    # empty `[workspace]` table (see engine/llm-firmware/Cargo.toml) rather
    # than being excluded here, so build it as its own project:
    # `cd llm-firmware && cargo build`. Same will apply to "llm-display"
    # once Phase 4 starts it -- also ESP32-target code.
]

# Workspace-wide release profile will be tuned here once we're benchmarking
# the Rust build against the numbers already recorded in
# reference-c/firmware/esp32_llm/README.md (102.9ms/step, 9.72 tok/s).

# Match llm-firmware's own [profile.release] (opt-level 3 / fat LTO /
# codegen-units 1). Without this the host build and the whole test suite ran
# at Cargo's defaults -- no cross-crate inlining of llm_core into llm_host --
# while the firmware it is meant to predict ran with LTO on. That is not a
# cosmetic difference: measured on x86-64, the tensor.rs unpack rewrite is
# worth ~4% without LTO and ~22% with it, because the win depends on LLVM
# being able to inline matvec_range across the crate boundary and specialize
# it. Benchmarking a kernel change in the un-inlined configuration would have
# understated it by 5x.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
